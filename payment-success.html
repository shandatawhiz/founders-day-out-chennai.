<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Registration Confirmed | Founders Day Out Chennai</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #090909;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 620px;
      padding: 48px 28px;
      border: 1px solid #292929;
      border-radius: 24px;
      background: #111111;
    }

    .brand {
      margin-bottom: 28px;
      color: #c6ff00;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .check {
      width: 76px;
      height: 76px;
      margin: 0 auto 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #c6ff00;
      color: #090909;
      font-size: 42px;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 32px;
      line-height: 1.2;
    }

    .message {
      margin: 0;
      color: #b8b8b8;
      font-size: 17px;
      line-height: 1.7;
    }

    .registration-id {
      margin: 30px 0 22px;
      padding: 18px;
      border-radius: 14px;
      background: #191919;
      color: #c6ff00;
      font-size: 16px;
      font-weight: 700;
      word-break: break-word;
    }

    .date {
      margin-top: 24px;
      color: #ffffff;
      font-size: 16px;
      line-height: 1.6;
    }

    .heart {
      color: #c6ff00;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="brand">
      Founders Day Out Chennai
    </div>

    <div class="check">
      ✓
    </div>

    <h1>
      Thank you for completing your registration!
    </h1>

    <p class="message">
      Your registration for
      <strong>Founders Day Out Chennai</strong>
      is confirmed.
    </p>

    <div class="registration-id">
      Registration ID:
      <span id="registrationId">Loading...</span>
    </div>

    <p class="date">
      We look forward to seeing you on
      <strong>Sunday, 27 September 2026.</strong>
      <span class="heart">❤️</span>
    </p>

  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const registrationId =
      params.get("registration_id") || "Confirmed";

    document.getElementById("registrationId").textContent =
      registrationId;
  </script>

</body>
</html>
